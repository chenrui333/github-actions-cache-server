name: Patch image

# Builds and pushes a patched image for each `patch-<version>` tag: tag
# `patch-9.7.0-backpressure.1` publishes ghcr.io/<owner>/github-actions-cache-server:9.7.0-backpressure.1.
# Kept separate from release.yml, which only releases from dev and moves `latest`.
on:
  push:
    tags:
      - 'patch-*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Image tag
        id: tag
        run: echo "TAG=${GITHUB_REF_NAME#patch-}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.TAG }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
